name: 🐍 Python Runnability Checks

on:
  pull_request:
    paths:
      - "core/python/**/*.py"
      - "contrib/**/*.py"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/manifest.yaml"

permissions:
  contents: read

jobs:
  runnability:
    name: Verify Python Runnability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Find and Run Runnability Tests
        run: |
          # 1. Dynamically resolve directories that actually exist in the clone
          # (Empty directories like 'contrib' are untracked by Git and won't exist in CI)
          SEARCH_DIRS=()
          for d in core/python contrib; do
            if [ -d "$d" ]; then
              SEARCH_DIRS+=("$d")
            fi
          done
          
          if [ ${#SEARCH_DIRS[@]} -eq 0 ]; then
            SEARCH_DIRS=(".")
          fi
          
          # Find all subfolders containing a pyproject.toml
          PROJECT_DIRS=$(find "${SEARCH_DIRS[@]}" -name "pyproject.toml" -not -path "*/.*" -exec dirname {} \;)
          
          if [ -z "$PROJECT_DIRS" ]; then
            echo "No Python projects found in the repository."
            exit 0
          fi
          
          # 2. Iterate and run pytest on each self-contained sample project
          for dir in $PROJECT_DIRS; do
            echo "======================================================="
            echo "🚀 RUNNABILITY CHECKS: Checking project in $dir"
            echo "======================================================="
            
            # Navigate into the project folder
            cd "$dir"
            
            # Install project environment including developer and optional groups
            uv sync --all-groups
            
            # Run ONLY structural compile and configuration tests (Mandatory Gate)
            # (Conftest.py handles local GCP mocks automatically in CI)
            if [ -f "tests/unit/test_runnability.py" ]; then
              echo "✅ Structural runnability verification harness found."
              uv run pytest -v tests/unit/test_runnability.py
            else
              echo "❌ ERROR: Mandatory runnability test file was not found at: $dir/tests/unit/test_runnability.py!"
              echo "Every ADK python sample is strictly required to implement 'tests/unit/test_runnability.py' to verify structural bootability."
              exit 1
            fi
            
            # Return back to workspace root
            cd - > /dev/null
          done
