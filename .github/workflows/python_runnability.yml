name: 🐍 Python Runnability Checks

on:
  pull_request:
    paths:
      - "core/python/**/*.py"
      - "contrib/**/*.py"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/manifest.yaml"

permissions:
  contents: read

jobs:
  runnability:
    name: Verify Python Runnability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Find and Run Runnability Tests
        run: |
          # 1. Find all subfolders containing a pyproject.toml
          PROJECT_DIRS=$(find core contrib -name "pyproject.toml" -exec dirname {} \;)
          
          if [ -z "$PROJECT_DIRS" ]; then
            echo "No Python projects found in the repository."
            exit 0
          fi
          
          # 2. Iterate and run pytest on each self-contained sample project
          for dir in $PROJECT_DIRS; do
            echo "======================================================="
            echo "🚀 RUNNABILITY CHECKS: Checking project in $dir"
            echo "======================================================="
            
            # Navigate into the project folder
            cd "$dir"
            
            # Install project environment including developer and optional groups
            uv sync --all-groups
            
            # Run test suite under CI mode
            # conftest.py handles local GCP mock fallbacks in zero-config runners
            uv run pytest -v
            
            # Return back to workspace root
            cd - > /dev/null
          done
