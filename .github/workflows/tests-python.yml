name: 🧪 Python Logic Tests

on:
  pull_request:
    paths:
      - "core/python/**/*.py"
      - "contrib/**/*.py"
      - "**/pyproject.toml"
      - "**/uv.lock"

permissions:
  contents: read

jobs:
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Find and Run Tests
        run: |
          # 1. Dynamically resolve directories that actually exist in the clone
          # (Empty directories like 'contrib' are untracked by Git and won't exist in CI)
          SEARCH_DIRS=()
          for d in core/python contrib; do
            if [ -d "$d" ]; then
              SEARCH_DIRS+=("$d")
            fi
          done
          
          if [ ${#SEARCH_DIRS[@]} -eq 0 ]; then
            SEARCH_DIRS=(".")
          fi
          
          # Find all subfolders containing a pyproject.toml
          PROJECT_DIRS=$(find "${SEARCH_DIRS[@]}" -name "pyproject.toml" -not -path "*/.*" -exec dirname {} \;)
          
          if [ -z "$PROJECT_DIRS" ]; then
            echo "No Python projects found in the repository."
            exit 0
          fi
          
          # 2. Iterate and run pytest on each self-contained sample project
          for dir in $PROJECT_DIRS; do
            echo "======================================================="
            echo "🚀 PYTHON TESTING: Running full test suite in $dir"
            echo "======================================================="
            
            # Navigate into the project folder
            cd "$dir"
            
            # Install project environment including developer and optional groups
            uv sync --all-groups
            
            # Run all standard tests, ignoring structural runnability verification checks
            # (which are validated strictly inside the dedicated runnability gate)
            uv run pytest -v --ignore=tests/unit/test_runnability.py
            
            # Return back to workspace root
            cd - > /dev/null
          done
